[project]
name = "nanoclaw"
version = "0.1.0"
description = "Personal Claude assistant. Lightweight, secure, customizable."
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.0",
    "croniter>=2.0",
    "aiohttp>=3.9",
    "python-telegram-bot>=22.7",
    "slack-bolt>=1.27.0",
]

[project.scripts]
nanoclaw = "nanoclaw.main:main_sync"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
source = ["nanoclaw"]
omit = [
    "nanoclaw/container_runner.py",  # Requires Docker for integration testing
    "nanoclaw/credential_proxy.py",  # Requires running HTTP proxy
    "nanoclaw/main.py",              # Entry point, tested via integration
    "nanoclaw/ipc.py",               # IPC watcher requires filesystem integration
    "nanoclaw/task_scheduler.py",    # Scheduler requires container integration
    "nanoclaw/remote_control.py",    # Requires claude CLI process
]

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "types-croniter>=6.2.2.20260316",
]
